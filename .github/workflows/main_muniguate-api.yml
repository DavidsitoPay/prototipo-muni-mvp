name: Build and deploy Python project to Azure Function App - muniguate-api

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'api-tests/**'
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_PACKAGE_PATH: 'backend'
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '22'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }} environment
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.lock.txt

      - name: Resolve project dependencies using pip
        shell: bash
        run: |
          pushd './${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}'
          python -m pip install --only-binary :all: pip==26.2.2
          pip install --only-binary :all: --require-hashes -r requirements.lock.txt --target=".python_packages/lib/site-packages"
          popd

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          include-hidden-files: true
          # Allowlist only what the deploy/migration jobs actually need - never a
          # blanket dump of the working directory, so no credential file (.env,
          # local.settings.json - both gitignored and never checked out by CI
          # anyway) can end up in the artifact even by accident.
          path: |
            ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}/app
            ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}/alembic
            ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}/alembic.ini
            ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}/function_app.py
            ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}/host.json
            ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}/requirements.txt
            ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}/requirements.lock.txt
            ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}/.python_packages

  # unit-tests-backend, unit-tests-frontend, static-analysis and api-tests below
  # have no needs: between them or on build - none of them reads build's output,
  # so they run concurrently. Only deploy actually needs build's artifact, and it
  # waits on all five below - the fail-blocks-deploy guarantee is identical to a
  # fully sequential chain, it just stops forcing jobs that don't depend on each
  # other to wait in line.
  unit-tests-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }} environment
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.lock.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --only-binary :all: pip==26.2.2
          pip install --only-binary :all: --require-hashes -r requirements.lock.txt

      - name: Run backend unit tests
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL_DEV }}
        run: pytest -q

  unit-tests-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Run frontend unit tests
        working-directory: frontend
        run: npm test

  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17 (requerido por el scanner de SonarCloud)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

      - name: Verificar quality gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

  api-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }} environment
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.lock.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --only-binary :all: pip==26.2.2
          pip install --only-binary :all: --require-hashes -r requirements.lock.txt

      - name: Sembrar datos de demo (idempotente)
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL_DEV }}
          SEED_ADMIN_TI_PASSWORD: ${{ secrets.SEED_ADMIN_TI_PASSWORD }}
          SEED_ANALISTA_RIESGO_PASSWORD: ${{ secrets.SEED_ANALISTA_RIESGO_PASSWORD }}
          SEED_DIRECTIVO_PASSWORD: ${{ secrets.SEED_DIRECTIVO_PASSWORD }}
        run: python -m seed.seed_data

      - name: Levantar el backend (uvicorn) contra la base de desarrollo
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL_DEV }}
        run: |
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 > uvicorn.log 2>&1 &
          echo $! > uvicorn.pid
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/api/health > /dev/null; then
              echo "Backend listo"
              exit 0
            fi
            sleep 1
          done
          echo "El backend no respondio a tiempo"
          cat uvicorn.log
          exit 1

      - name: Setup Node ${{ env.NODE_VERSION }} (para Newman)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Ejecutar pruebas de API (Newman)
        env:
          ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_TI_PASSWORD }}
          ANALISTA_PASSWORD: ${{ secrets.SEED_ANALISTA_RIESGO_PASSWORD }}
          DIRECTIVO_PASSWORD: ${{ secrets.SEED_DIRECTIVO_PASSWORD }}
        run: |
          npx --yes newman run api-tests/muniguate-sgcm.postman_collection.json \
            -e api-tests/muniguate-ci.postman_environment.json \
            --env-var admin_password="$ADMIN_PASSWORD" \
            --env-var analista_password="$ANALISTA_PASSWORD" \
            --env-var directivo_password="$DIRECTIVO_PASSWORD" \
            --bail

      - name: Mostrar el log del backend si algo falló
        if: failure()
        working-directory: backend
        run: cat uvicorn.log

      - name: Detener el backend
        if: always()
        working-directory: backend
        run: |
          if [ -f uvicorn.pid ]; then kill "$(cat uvicorn.pid)" || true; fi

  deploy:
    runs-on: ubuntu-latest
    needs: [build, unit-tests-backend, unit-tests-frontend, static-analysis, api-tests]
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app
          path: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}

      - name: Setup Python ${{ env.PYTHON_VERSION }} environment
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.lock.txt

      - name: Install migration dependencies
        shell: bash
        working-directory: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
        run: |
          python -m pip install --quiet --only-binary :all: --require-hashes -r requirements.lock.txt

      - name: Run database migrations (Neon production)
        shell: bash
        working-directory: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          python -c "
          import sys, os
          # python -c always inserts the CWD ('backend/') as sys.path[0]. That
          # directory contains our own alembic/ migrations folder (no config.py
          # in it), which shadows the real installed alembic library. Drop the
          # auto-inserted CWD entry before importing, then restore it afterwards
          # so alembic/env.py's 'from app...' imports still resolve.
          sys.path = [p for p in sys.path if p not in ('', '.')]
          from alembic.config import main
          sys.path.append(os.getcwd())
          main(argv=['upgrade', 'head'])
          "

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@c5060b3b8bb1ebbcb531abd00c822ecbaa8ea656 # v1.5.7
        id: deploy-to-function
        with:
          app-name: 'muniguate-api'
          package: '${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}'
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
          scm-do-build-during-deployment: true
          enable-oryx-build: true
